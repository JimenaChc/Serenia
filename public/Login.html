<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Serenia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/192x192.png">
<meta name="apple-mobile-web-app-status-bar" content="#38a3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="auth-container">
  <div class="completar-wrapper">
    <div class="logo-text">Serenia</div>
    <h2>Iniciar Sesión</h2>

    <form id="formLogin">
      <input type="email" class="form-control" name="Correo" placeholder="Correo electrónico" required>
      <input type="password" class="form-control" name="Contrasena" placeholder="Contraseña" required>
      <button class="btn-login mt-2" type="submit">Entrar</button>
      <!-- Botón de registro/login con Google -->
<div class="text-center mt-3">
  <div id="g_id_onload"
       data-callback="handleCredentialResponse">

  </div>
  <div class="g_id_signin"
       data-type="standard"
       data-shape="rectangular"
       data-theme="outline"
       data-text="signup_with"
       data-size="large"
       data-logo_alignment="left">
  </div>
</div>
    </form>

    <div id="mensajeFlotante" class="mensaje-flotante"></div>


    <div class="text-center mt-3">
       <a href="recuperarContrasena.html">¿Olvidaste tu contraseña?</a>
      <p>¿No tienes cuenta? <a href="registro.html">Crea una aquí</a></p>
    </div>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./js/login.js"></script>
  <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js")
    .then(() => console.log("Service Worker registrado"))
    .catch(err => console.log("Error en SW", err));
}
</script>
</body>
</html>
