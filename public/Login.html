<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Serenia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth-container">
  <div>
    <div class="logo-text">Serenia</div>
    <h2>Iniciar Sesión</h2>

    <form id="formLogin">
      <input type="email" class="form-control" name="Correo" placeholder="Correo electrónico" required>
      <input type="password" class="form-control" name="Contrasena" placeholder="Contraseña" required>
      <button class="btn-login mt-2">Entrar</button>
    </form>

    <div id="mensajeFlotante" class="mensaje-flotante"></div>


    <div class="text-center mt-3">
      <p>¿No tienes cuenta? <a href="registro.html">Crea una aquí</a></p>
    </div>
  </div>

  <script src="./js/login.js"></script>
</body>
</html>
