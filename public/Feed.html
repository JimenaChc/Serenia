<!DOCTYPE html>
<html>
    <head>
     <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspiraciones Serenia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/estilos.css" />

</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">Inspiraciones Serenia</h2>
    <div id="feed" class="feed"></div>
  </div>
  <div class="modal fade" id="modalImagen" tabindex="-1" aria-labelledby="modalImagenLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <img id="modalImg" class="modal-img mb-3" src="" alt="">
          <h5 id="modalTitulo"></h5>
          <p id="modalDescripcion" class="text-muted"></p>

          <!-- Botones de interacción -->
          <div class="d-flex justify-content-center gap-4 mt-3">
            <button id="btnLike" class="btn btn-outline-danger">
               Me gusta
            </button>
            <button id="btnGuardar" class="btn btn-outline-primary">
              Guardar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal seleccionar tablero o crear -->
<div class="modal fade" id="modalSeleccionarTablero" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-seleccionar">
      <div class="modal-header">
        <h5 class="modal-title">Guardar en tablero</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <div id="contenedorTableros" class="d-flex flex-column gap-2"></div>

        <hr>
        <button id="btnMostrarFormNuevo" class="btn btn-outline-primary w-100 mt-2">
          + Crear nuevo tablero
        </button>

        <form id="formNuevoTablero" class="mt-3 d-none">
          <input type="text" id="nombreNuevoTablero" class="form-control mb-2" placeholder="Nombre del tablero">
          <button type="submit" class="btn btn-primary w-100">Crear y guardar aquí</button>
        </form>
      </div>
    </div>
  </div>
</div>


  <script src="./js/feed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

  <nav class="bottom-nav">

      <i class="bi bi-house-door"></i>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-envelope"></i>
    </a>
    <a href="#" class="nav-item center-btn">
      <i class="bi bi-plus-circle"></i>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-collection"></i>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-person"></i>
    </a>
  </nav>

  <!-- Bootstrap icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</html>
