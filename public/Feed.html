<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspiraciones Serenia</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/estilos.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

  <div class="container py-4">
    <h2 class="text-center mb-4">Inspiraciones Serenia</h2>
    <div id="feed" class="feed"></div>
  </div>

  <!-- Modal Imagen -->
  <div class="modal fade" id="modalImagen" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center position-relative">
          <button id="btnRegresar" class="btn btn-light position-absolute top-0 start-0 m-2">← Regresar</button>
          <img id="modalImg" class="modal-img mb-3 w-100" src="" alt="">
          <h5 id="modalTitulo"></h5>
          <p id="modalDescripcion" class="text-muted"></p>

          <div class="d-flex justify-content-center gap-4 mt-3">
            <button id="btnLike" class="btn btn-outline-danger">Me gusta</button>
            <button id="btnGuardar" class="btn btn-outline-primary">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Seleccionar/Crear Tablero -->
  <div class="modal fade" id="modalSeleccionarTablero" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content modal-tablero p-3">
        <h5 class="text-center mb-3">Guardar en un tablero</h5>
        <div id="contenedorTableros" class="d-grid gap-2"></div>

        <button id="btnNuevoTablero" class="btn btn-outline-success mt-3">+ Crear nuevo tablero</button>

        <!-- Formulario oculto para crear tablero -->
        <div id="formNuevoTablero" class="mmt-3 d-none">
          <input type="text" id="nombreTablero" class="form-control" placeholder="Nombre del tablero">
          <button id="btnGuardarTablero" class="btn btn-success mt-2 w-100">Guardar tablero</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje flotante -->
  <div id="mensajeFlotante" class="mensaje-flotante"></div>
    <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Feed JS -->
  <script src="./js/feed.js"></script>

</body>

  <!-- Menú inferior -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active"><i class="bi bi-house-door"></i></a>
    <a href="#" class="nav-item"><i class="bi bi-envelope"></i></a>
    <a href="#" class="nav-item center-btn"><i class="bi bi-plus-circle"></i></a>
    <a href="#" class="nav-item"><i class="bi bi-collection"></i></a>
    <a href="#" class="nav-item"><i class="bi bi-person"></i></a>
  </nav>

</html>
