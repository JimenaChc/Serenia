<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspiraciones Serenia</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/estilos.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

  <div class="container py-4">
    <h1 class="newHead">Inicio</h1>
    <div id="carouselInterior" class="carousel slide category-carousel-inicio category-carousel" data-bs-ride="carousel">
    <a href="./FormularioCotizacion.html">
    <div class="carousel-inner">
        <img src="https://res.cloudinary.com/dyxi3knlx/image/upload/v1760063146/ca9449e8-f942-44ff-b56a-10e9f896f869_qs9nl8.jpg" alt="Interior 2">
        <div class="category-text">Te acompañamos desde la inspiración hasta el diseño final</div>

    </div>
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselInterior" data-bs-slide-to="0" class=""></button>
      <button type="button" data-bs-target="#carouselInterior" data-bs-slide-to="1" class="active" aria-current="true"></button>
    </div>
    </a>
  </div>
<!-- Botones de catálogos -->
 <h1 class="newHead">Catalogos</h1>
<div class="catalogo-buttons mt-3 d-flex gap-3 overflow-auto pb-2">
  <button class="btn btn-catalogo" id="btnMuebles">
   <i class="bi bi-box-seam"></i> Muebles
  </button>

  <button class="btn btn-catalogo" id="btnLamparas">
   <i class="bi bi-lightbulb"></i> Lámparas
  </button>

  <button class="btn btn-catalogo" id="btnDisenadores">
   <i class="bi bi-people"></i> Diseñadores
  </button>
</div>
<h1 class="newHead">Inspiración</h1>
    <div id="feed" class="feed"></div>
  </div>

  <!-- Modal Imagen -->
  <div class="modal fade" id="modalImagen" tabindex="-1" aria-hidden="False">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center position-relative">
          <button id="btnRegresar" class="btn btn-light position-absolute top-0 start-0 m-2">← Regresar</button>
          <img id="modalImg" class="modal-img mb-3 w-100" src="" alt="">
          <h5 id="modalTitulo"></h5>
          <p id="modalDescripcion" class="text-muted"></p>

          <div class="d-flex justify-content-center gap-4 mt-3">
            <button id="btnLike" class="btn btn-outline-danger"><i class="bi bi-suit-heart"></i></button>
            <button id="btnGuardar" class="btn btn-outline-primary">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Seleccionar/Crear Tablero -->
  <div class="modal fade" id="modalSeleccionarTablero" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content modal-tablero p-3">
        <h5 class="text-center mb-3">Guardar en un tablero</h5>
        <div id="contenedorTableros" class="d-grid gap-2"></div>

        <button id="btnNuevoTablero" class="btn btn-outline-success mt-3">+ Crear nuevo tablero</button>

        <!-- Formulario oculto para crear tablero -->
        <div id="formNuevoTablero" class="mmt-3 d-none">
          <input type="text" id="nombreTablero" class="form-control" placeholder="Nombre del tablero">
          <button id="btnGuardarTablero" class="btn btn-success mt-2 w-100">Guardar tablero</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje flotante -->
  <div id="mensajeFlotante" class="mensaje-flotante"></div>
    <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Feed JS -->
  <script src="./js/feed.js" defer></script>
  <script src="./js/catalogos.js" defer></script>

</body>

  <!-- Menú inferior -->
<nav class="bottom-nav">

    <span class="nav-label">Crear</span>
  </a>

  <a href="./Cotizaciones.html" class="nav-item">
    <div class="nav-icon"><i class="bi bi-box"></i></div>
    <span class="nav-label">Proyectos</span>
  </a>

  <a href="./Tableros.html" class="nav-item">
    <div class="nav-icon"><i class="bi bi-person"></i></div>

  </a>
</nav>
