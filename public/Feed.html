<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Inspiraciones Serenia</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/estilos.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

  <div class="container py-4">
    <div id="carouselInterior" class="carousel slide category-carousel" data-bs-ride="carousel">
    <a href="./FormularioCotizacion.html">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://res.cloudinary.com/dyxi3knlx/image/upload/v1760063150/a1c3ff32-6c19-4125-be51-b3930a6ff200_tyesf6.jpg" alt="Interior">
        <div class="category-text">Encuentra inspiración para tu próximo proyecto</div>
      </div>
      <div class="carousel-item ">
        <img src="https://res.cloudinary.com/dyxi3knlx/image/upload/v1760329301/a6d88c29-fc37-4ba0-b795-59ad97b114a2_li39le.jpg " alt="Interior 2">
        <div class="category-text">Crea espacios que reflejen tu esencia</div>
      </div>
      <div class="carousel-item">
        <img src="https://res.cloudinary.com/dyxi3knlx/image/upload/v1760329301/a6d88c29-fc37-4ba0-b795-59ad97b114a2_li39le.jpg " alt="Interior 2">
        <div class="category-text">Te acompañamos desde la inspiración hasta el diseño final</div>
      </div>
    </div>
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselInterior" data-bs-slide-to="0" class=""></button>
      <button type="button" data-bs-target="#carouselInterior" data-bs-slide-to="1" class="active" aria-current="true"></button>
    </div>
    </a>
  </div>
    <div id="feed" class="feed"></div>
  </div>

  <!-- Modal Imagen -->
  <div class="modal fade" id="modalImagen" tabindex="-1" aria-hidden="False">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center position-relative">
          <button id="btnRegresar" class="btn btn-light position-absolute top-0 start-0 m-2">← Regresar</button>
          <img id="modalImg" class="modal-img mb-3 w-100" src="" alt="">
          <h5 id="modalTitulo"></h5>
          <p id="modalDescripcion" class="text-muted"></p>

          <div class="d-flex justify-content-center gap-4 mt-3">
            <button id="btnLike" class="btn btn-outline-danger"><i class="bi bi-suit-heart"></i></button>
            <button id="btnGuardar" class="btn btn-outline-primary">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Seleccionar/Crear Tablero -->
  <div class="modal fade" id="modalSeleccionarTablero" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content modal-tablero p-3">
        <h5 class="text-center mb-3">Guardar en un tablero</h5>
        <div id="contenedorTableros" class="d-grid gap-2"></div>

        <button id="btnNuevoTablero" class="btn btn-outline-success mt-3">+ Crear nuevo tablero</button>

        <!-- Formulario oculto para crear tablero -->
        <div id="formNuevoTablero" class="mmt-3 d-none">
          <input type="text" id="nombreTablero" class="form-control" placeholder="Nombre del tablero">
          <button id="btnGuardarTablero" class="btn btn-success mt-2 w-100">Guardar tablero</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje flotante -->
  <div id="mensajeFlotante" class="mensaje-flotante"></div>
    <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Feed JS -->
  <script src="./js/feed.js"></script>

</body>
