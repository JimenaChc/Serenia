<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - Serenia</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Tus estilos -->
  <link rel="stylesheet" href="./css/estilos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

</head>
<body class="mockup-page">

  <div class="perfil-container">
    <!-- Encabezado -->
    <div class="perfil-header">
      <h2 class="perfil-titulo">Configuración</h2>
      <a href="./Ajustes.html"><i class="bi bi-gear-fill icon-config"></i></a>
    </div>

    <p class="perfil-subtitulo">Tu perfil</p>

<!-- Imagen de perfil -->
<div class="perfil-foto">
  <img id="fotoPerfil" src="./img/person_placeholder.jpg" alt="Perfil">
  <label for="inputFotoPerfil" class="editar-foto">
    <i class="bi bi-pencil-fill"></i>
  </label>
  <input type="file" id="inputFotoPerfil" hidden accept="image/*">
</div>

<!-- Formulario -->
<form class="perfil-formulario" id="formPerfil">
  <input type="text" id="inputNombre" class="form-input" placeholder="Nombre">
  <input type="text" id="inputTelefono" class="form-input" placeholder="Teléfono">
  <input type="email" id="inputCorreo" class="form-input" placeholder="Correo">
  <input type="password" id="inputContrasena" class="form-input" placeholder="Contraseña">
  <button type="submit" class="btn-hecho">Guardar Cambios</button>
</form>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
  <!-- Menú inferior -->
  <nav class="bottom-nav">
    <a href="./feed.html" class="nav-item active"><i class="bi bi-house-door"></i></a>
    <a href="./Likes.html" class="nav-item"><i class="bi bi-suit-heart"></i></a>
    <a href="./IniciarProyecto.html" class="nav-item center-btn"><i class="bi bi-plus-circle"></i></a>
    <a href="./Cotizaciones.html" class="nav-item"><i class="bi bi-box"></i></a>
    <a href="./Tableros.html" class="nav-item"><i class="bi bi-person"></i></a>
  </nav>
</html>
