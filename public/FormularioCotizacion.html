<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Cotización - Serenia</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/estilos.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>

<body>
  <div class="formulario-container">
    <h2 class="newHead">Nueva Cotización</h2>

    <form id="formProyecto">
      <input type="text" id="nombreProyecto" class="form-input" placeholder="Nombre del proyecto" required>
      <select id="pais" class="form-control"></select>
      <select id="provincia" class="form-control" disabled></select>
      <select id="canton" class="form-control" disabled></select>
      
      <select id="idServicio" class="form-input" required>
        <option value="">Seleccionar servicio</option>
        <option value="1">Decoración Interior</option>
        <option value="2">Renovación Interior</option>
        <option value="3">Escenografia</option>
      </select>

      <select id="idEspacioEvento" class="form-input" required>
        <option value="">Tipo de espacio o evento</option>
        <option value="5">Interior</option>
        <option value="2">Exterior</option>
      </select>

      <input type="number" id="montoEstimado" class="form-input" placeholder="₡ Presupuesto Estimado" required>
      <textarea id="descripcion" class="form-input area" placeholder="Descripción / ideas"></textarea>

      <!-- Subida de imágenes -->
      <div class="foto-upload">
        <label for="fotoInput" class="foto-label">
          <i class="fa-solid fa-image fa-2x"></i>
          <p>Añade fotos de tu espacio<br><span>(puedes subir varias)</span></p>
        </label>
        <input type="file" id="fotoInput" accept="image/*" multiple hidden>
        <div class="foto-preview" id="fotoPreview"></div>
      </div>

      <button type="submit" class="btn-hecho">Hecho</button>
    </form>

    <button class="btn-cancelar" onclick="window.location.href='feed.html'">Cancelar</button>
  </div>
  <div id="mensajeFlotante" class="mensaje-flotante"></div>
  <!-- Menú inferior -->
<nav class="bottom-nav">
  <a href="./feed.html" class="nav-item active">
    <div class="nav-icon"><i class="bi bi-house-door"></i></div>
    <span class="nav-label">Inicio</span>
  </a>

  <a href="./Likes.html" class="nav-item">
    <div class="nav-icon"><i class="bi bi-suit-heart"></i></div>
    <span class="nav-label">Likes</span>
  </a>

  <a href="./IniciarProyecto.html" class="nav-item center-btn">
    <div class="nav-icon"><i class="bi bi-plus-circle"></i></div>
  </a>

  <a href="./Cotizaciones.html" class="nav-item">
    <div class="nav-icon"><i class="bi bi-box"></i></div>
    <span class="nav-label">Proyectos</span>
  </a>

  <a href="./Tableros.html" class="nav-item">
    <div class="nav-icon"><i class="bi bi-person"></i></div>
    <span class="nav-label">Perfil</span>
  </a>
</nav>


  <script  src="./js/cotizaciones.js"></script>
</body>
</html>
