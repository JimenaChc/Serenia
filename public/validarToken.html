<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar Código | Serenia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth-container">
  <div class="completar-wrapper">
    <h2>Verificar Código</h2>
    <form id="formValidarToken">
      <input type="text" class="form-control" name="Token" placeholder="Código de autenticación" required>
      <button class="btn-login mt-2">Verificar</button>
    </form>
    <div id="mensajeFlotante" class="mensaje-flotante"></div>
  </div>
  <script src="./js/olvidoContrasena.js"></script>
</body>
</html>
