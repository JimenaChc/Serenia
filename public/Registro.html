<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta - Serenia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body class="auth-container">
  <div >
    <div class="logo-text">Serenia</div>
    <h2>Crear Cuenta</h2>
    
    <form id="formRegistro">
      <input type="text" class="form-control" name="Nombre" placeholder="Nombre" required>
      <input type="text" class="form-control" name="Apellidos" placeholder="Apellidos" required>
      <input type="email" class="form-control" name="Correo" placeholder="Correo electrónico" required>
      <input type="password" class="form-control" name="Contrasena" placeholder="Contraseña" required>
      <input type="text" class="form-control" name="Telefono" placeholder="Teléfono (opcional)">
      <button class="btn btn-success mt-2">Registrarse</button>
    </form>
   <div id="mensajeFlotante" class="mensaje-flotante"></div>
    <div class="text-center mt-3">
      <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </div>

  <script src="./js/usuarios.js"></script>
</body>
</html>
