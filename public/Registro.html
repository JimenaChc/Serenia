<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar correo - Serenia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./css/estilos.css" rel="stylesheet" />
</head>
<body class="auth-container">
  <div class="vercorreo-wrapper">
  <h2>Crear cuenta</h2>
  <p>Ingresa tu correo electrónico</p>

  <form id="formCorreo">
    <input type="email" class="form-control" name="correo" placeholder="Correo electrónico" required>
    <button class="btn btn-success mt-2">Enviar verificación</button>
    <button class="btn btn-success mt-2" >Volver</button>
  </form>
  <div class="text-center mt-3">
  <div id="g_id_onload"
       data-client_id=""
       data-callback="handleCredentialResponse">

  </div>
  <div class="g_id_signin"
       data-type="standard"
       data-shape="rectangular"
       data-theme="outline"
       data-text="signup_with"
       data-size="large"
       data-logo_alignment="left">
  </div>
</div>

  <div id="mensajeFlotante" class="mensaje-flotante"></div>
</div>


  <script>
    async function mostrarMensajeFlotante(texto, duracion = 3000) {
      const mensaje = document.getElementById("mensajeFlotante");
      mensaje.textContent = texto;
      mensaje.classList.add("show");
      setTimeout(() => mensaje.classList.remove("show"), duracion);
    }

    document.getElementById("formCorreo").addEventListener("submit", async (e) => {
      e.preventDefault();
      const correo = e.target.correo.value;

      const res = await fetch("/api/verificacion/enviar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo })
      });

      const data = await res.json();
      if (res.ok) {
        mostrarMensajeFlotante("Correo de verificación enviado. Revisa tu bandeja.");
      } else {
        mostrarMensajeFlotante("Error: " + data.error);
      }
    });
  </script>
</body>
</html>
