<!-- proyectos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Proyectos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="mockup-page">

  <h2 class="titulo-principal">Mis Proyectos</h2>

  <!-- Contenedor de proyectos -->
  <div id="listaProyectos" class="row g-3 px-2">
    <!-- Los proyectos se cargarán aquí desde JS -->
  </div>

  <!-- Modal para ver progreso -->
  <div class="modal fade" id="modalProgreso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
      <div class="modal-content modal-tablero p-3">
        <div class="modal-header border-0">
          <h5 id="tituloProyecto" class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="imagenesProgreso" style="column-count:2; column-gap:0.5rem;">
          <!-- Las imágenes se cargarán aquí -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="proyectos.js"></script>
</body>
</html>
