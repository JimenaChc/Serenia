<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar 2FA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body class="auth-container">

  <div class="formulario-container text-center">
    <div class="formulario-titulo">Verificación de doble factor</div>
    <p>Ingresa el código que aparece en tu app Google Authenticator:</p>

    <input 
      id="codigo" 
      type="text" 
      class="form-input mx-auto text-center" 
      placeholder="Código de 6 dígitos" 
      maxlength="6" 
    />

    <button id="btnVerificar" class="btn-hecho mt-3">Verificar</button>
  </div>

  <div id="mensajeFlotante" class="mensaje-flotante"></div>

  <script src="/js/verificarFA.js"></script>
</body>
</html>
