<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar 2FA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="auth-container">
  <div class="container mt-5 text-center">
    <h2>Verificación de doble factor</h2>
    <p>Ingresa el código que aparece en tu app Google Authenticator:</p>
    <input id="codigo" type="text" class="form-control w-50 mx-auto text-center mt-3" placeholder="Código de 6 dígitos" maxlength="6" />
    <button id="btnVerificar" class="btn btn-primary mt-3">Verificar</button>
  </div>
  <script src="./js/verificarFA.js"></script>
</body>
</html>
