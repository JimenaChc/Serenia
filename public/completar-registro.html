<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completar registro - Serenia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="auth-container">
  <div>
    <h2>Completa tu registro</h2>
    <form id="formCompletar">
      <input type="text" class="form-control" name="nombre" placeholder="Nombre" required>
      <input type="text" class="form-control" name="apellidos" placeholder="Apellidos" required>
      <input type="text" class="form-control" name="usuario" placeholder="Nombre de usuario" required>
      <input type="password" class="form-control" name="contrasena" placeholder="Contraseña" required>
      <input type="text" class="form-control" name="telefono" placeholder="Teléfono (opcional)">
      <button class="btn btn-success mt-2">Finalizar registro</button>
    </form>

    <div id="mensajeFlotante" class="mensaje-flotante"></div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get("token");

    async function mostrarMensajeFlotante(texto, duracion = 3000) {
      const mensaje = document.getElementById("mensajeFlotante");
      mensaje.textContent = texto;
      mensaje.classList.add("show");
      setTimeout(() => mensaje.classList.remove("show"), duracion);
    }

    document.getElementById("formCompletar").addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(e.target));
      datos.token = token;

      const res = await fetch("/api/verificacion/completar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      });

      const data = await res.json();
      if (res.ok) {
        mostrarMensajeFlotante("Usuario creado correctamente");
        setTimeout(() => window.location.href = "feed.html", 2000);
      } else {
        mostrarMensajeFlotante("Error: " + data.error);
      }
    });
  </script>
</body>
</html>
